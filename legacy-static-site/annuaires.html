<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaires Sala — Universités, Entreprises & Clubs d'Anglais au Congo</title>
  <meta name="description" content="Découvrez les universités, les entreprises qui recrutent et les clubs d'anglais à Brazzaville et Pointe-Noire sur Sala.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/logo_100.png">

  <!-- Polices Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Stylesheets -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/sala-theme.css" rel="stylesheet">

  <style>
    .annuaire-nav-tabs {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 24px;
    }

    .annuaire-tab-btn {
      background: #ffffff;
      border: 1.5px solid var(--sala-border);
      color: #555e68;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      transition: all 0.2s ease;
      box-shadow: var(--sala-shadow-sm);
    }

    .annuaire-tab-btn:hover {
      border-color: var(--sala-green);
      color: var(--sala-green-dark);
    }

    .annuaire-tab-btn.active {
      background: var(--sala-green);
      color: #ffffff;
      border-color: var(--sala-green);
      box-shadow: var(--sala-shadow-green);
    }

    .annuaire-card {
      background: #ffffff;
      border: 1px solid var(--sala-border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--sala-shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .annuaire-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--sala-shadow-md);
      border-color: var(--sala-green-border);
    }

    .card-icon-header {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .icon-uni { background: #eaf6ed; color: var(--sala-green-dark); }
    .icon-comp { background: #e0f2fe; color: #0284c7; }
    .icon-club { background: #fefce8; color: #b45309; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="sala-topbar">
    <div class="d-flex align-items-center gap-3">
      <a href="index.html" class="d-flex align-items-center text-decoration-none">
        <img src="img/logo_transparent.png" alt="Logo Sala" style="height: 40px; width: auto;" class="me-2">
        <span style="font-weight: 800; font-size: 1.3rem; color: var(--sala-green);">SALA</span>
      </a>
    </div>

    <div class="d-flex align-items-center gap-2">
      <a href="offres.html" class="btn-sala-outline py-1 px-3" style="font-size: 0.85rem;">
        <i class="fas fa-briefcase me-1"></i> Offres
      </a>
      <a href="profile.html" class="btn btn-light py-1 px-3 rounded-pill text-muted small" id="navProfileBtn">
        <i class="fas fa-user me-1"></i> Profil
      </a>
    </div>
  </header>

  <!-- En-tête -->
  <div class="container py-4">
    <div class="text-center mb-4">
      <span class="badge-sala-green px-3 py-1 mb-2">Réseau & Écosystème Congolais</span>
      <h1 class="h2 fw-bold text-dark mb-2">Les Annuaires Sala</h1>
      <p class="text-muted" style="max-width: 600px; margin: 0 auto;">
        Découvrez les établissements universitaires, les recruteurs partenaires et les clubs linguistiques au Congo.
      </p>
    </div>

    <!-- Sélecteur d'annuaire (3 Onglets) -->
    <div class="annuaire-nav-tabs justify-content-center">
      <button class="annuaire-tab-btn active" data-category="universities">
        <i class="fas fa-graduation-cap"></i> Universités & Écoles
      </button>
      <button class="annuaire-tab-btn" data-category="companies">
        <i class="fas fa-building"></i> Entreprises & Recruteurs
      </button>
      <button class="annuaire-tab-btn" data-category="clubs">
        <i class="fas fa-comments"></i> Clubs d'Anglais
      </button>
    </div>

    <!-- Barre de recherche et filtre ville -->
    <div class="row g-2 mb-4 align-items-center" style="max-width: 780px; margin: 0 auto;">
      <div class="col-sm-8">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
          <input type="text" id="annuaireSearchInput" class="form-control border-start-0 ps-0" placeholder="Rechercher par nom, filière ou secteur...">
        </div>
      </div>
      <div class="col-sm-4">
        <select id="annuaireCitySelect" class="form-select">
          <option value="all">Toutes les villes</option>
          <option value="Brazzaville">Brazzaville</option>
          <option value="Pointe-Noire">Pointe-Noire</option>
          <option value="Kintélé">Kintélé</option>
        </select>
      </div>
    </div>

    <!-- Grille des cartes -->
    <div class="row g-3" id="cardsGrid">
      <!-- Rempli dynamiquement -->
    </div>
  </div>

  <!-- Bouton Flottant FAB "Faire un CV" -->
  <a href="cv-builder.html" class="sala-fab-cv" title="Faire un CV">
    <i class="fas fa-pen"></i>
    <span class="tooltip-text">Faire un CV professionnel</span>
  </a>

  <!-- Barre de navigation mobile inférieure (Bottom Navigation) -->
  <nav class="sala-bottom-nav">
    <a href="offres.html" class="sala-bottom-nav-item">
      <i class="fas fa-briefcase"></i>
      <span>Emplois</span>
    </a>
    <a href="evenements.html" data-nav-key="evenements" class="sala-bottom-nav-item">
      <i class="fas fa-calendar-alt"></i>
      <span>Événements</span>
    </a>
    <a href="cv-builder.html" class="sala-bottom-fab" title="Faire un CV">
      <i class="fas fa-pen"></i>
    </a>
    <a href="entretiens.html" data-nav-key="entretiens" class="sala-bottom-nav-item">
      <i class="fas fa-user-tie"></i>
      <span>Entretiens</span>
    </a>
    <a href="legislation.html" data-nav-key="legislation" class="sala-bottom-nav-item">
      <i class="fas fa-balance-scale"></i>
      <span>Droit</span>
    </a>
  </nav>

  <!-- Script des annuaires -->
  <script type="module">
    import { loadUniversities, loadCompanies, loadEnglishClubs } from "./js/annuaires-data.js";
    import { auth, onAuthStateChanged } from "./js/firebase-config.js";
    import { loadSiteSettings, applyNavVisibility } from "./js/site-settings.js";
    loadSiteSettings().then(applyNavVisibility);

    let currentCategory = "universities";
    let dataUniversities = [];
    let dataCompanies = [];
    let dataClubs = [];

    const tabButtons = document.querySelectorAll(".annuaire-tab-btn");
    const cardsGrid = document.getElementById("cardsGrid");
    const searchInput = document.getElementById("annuaireSearchInput");
    const citySelect = document.getElementById("annuaireCitySelect");

    // Chargement initial des données
    async function initData() {
      cardsGrid.innerHTML = `
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-success" role="status"></div>
          <p class="text-muted mt-2">Chargement de l'annuaire...</p>
        </div>
      `;
      [dataUniversities, dataCompanies, dataClubs] = await Promise.all([
        loadUniversities(),
        loadCompanies(),
        loadEnglishClubs()
      ]);
      renderActiveCategory();
    }

    function renderActiveCategory() {
      const searchTerm = searchInput.value.trim().toLowerCase();
      const selectedCity = citySelect.value;

      let items = [];
      if (currentCategory === "universities") items = dataUniversities;
      else if (currentCategory === "companies") items = dataCompanies;
      else if (currentCategory === "clubs") items = dataClubs;

      const filtered = items.filter(item => {
        const matchCity = (selectedCity === "all") || (item.city && item.city.toLowerCase() === selectedCity.toLowerCase());
        if (!matchCity) return false;

        if (!searchTerm) return true;
        const text = JSON.stringify(item).toLowerCase();
        return text.includes(searchTerm);
      });

      if (filtered.length === 0) {
        cardsGrid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="fas fa-search fa-3x text-muted mb-3"></i>
            <h5 class="fw-bold">Aucun résultat trouvé</h5>
            <p class="text-muted">Essayez de modifier vos termes de recherche ou la ville sélectionnée.</p>
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = filtered.map(item => {
        if (currentCategory === "universities") {
          return `
            <div class="col-md-6 col-lg-4">
              <div class="annuaire-card">
                <div>
                  <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="card-icon-header icon-uni"><i class="fas fa-graduation-cap"></i></div>
                    <div>
                      <span class="badge-sala-green">${item.type || 'Enseignement Supérieur'}</span>
                      <h5 class="fw-bold mb-0 mt-1" style="font-size: 1.05rem;">${item.name}</h5>
                    </div>
                  </div>
                  <div class="text-muted small mb-2"><i class="fas fa-map-marker-alt text-success me-1"></i> ${item.city} — ${item.address || ''}</div>
                  <div class="mb-3">
                    <div class="small fw-bold text-dark mb-1">Filières & Départements :</div>
                    <div class="d-flex flex-wrap gap-1">
                      ${(item.faculties || []).map(f => `<span class="badge bg-light text-dark border" style="font-size:0.75rem;">${f}</span>`).join("")}
                    </div>
                  </div>
                </div>
                <div class="pt-3 border-top d-flex gap-2 justify-content-between align-items-center">
                  ${item.phone ? `<a href="tel:${item.phone}" class="btn btn-sm btn-outline-success rounded-pill"><i class="fas fa-phone-alt me-1"></i> Appeler</a>` : '<span></span>'}
                  ${item.website ? `<a href="${item.website}" target="_blank" class="btn btn-sm btn-sala-primary rounded-pill"><i class="fas fa-globe me-1"></i> Site Web</a>` : ''}
                </div>
              </div>
            </div>
          `;
        } else if (currentCategory === "companies") {
          return `
            <div class="col-md-6 col-lg-4">
              <div class="annuaire-card">
                <div>
                  <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="card-icon-header icon-comp"><i class="fas fa-building"></i></div>
                    <div>
                      <span class="badge bg-primary-subtle text-primary fw-bold" style="font-size:0.75rem;">${item.sector}</span>
                      <h5 class="fw-bold mb-0 mt-1" style="font-size: 1.05rem;">${item.name}</h5>
                    </div>
                  </div>
                  <div class="text-muted small mb-2"><i class="fas fa-map-marker-alt text-primary me-1"></i> ${item.city}</div>
                  <p class="text-secondary small mb-3" style="line-height:1.5;">${item.description || ''}</p>
                </div>
                <div class="pt-3 border-top d-flex gap-2 justify-content-between align-items-center">
                  ${item.email ? `<a href="mailto:${item.email}" class="btn btn-sm btn-outline-primary rounded-pill"><i class="fas fa-envelope me-1"></i> Contact RH</a>` : '<span></span>'}
                  ${item.website ? `<a href="${item.website}" target="_blank" class="btn btn-sm btn-primary rounded-pill"><i class="fas fa-external-link-alt me-1"></i> Découvrir</a>` : ''}
                </div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="col-md-6 col-lg-4">
              <div class="annuaire-card">
                <div>
                  <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="card-icon-header icon-club"><i class="fas fa-comments"></i></div>
                    <div>
                      <span class="badge bg-warning-subtle text-dark fw-bold" style="font-size:0.75rem;">${item.fee || 'Club Ouvert'}</span>
                      <h5 class="fw-bold mb-0 mt-1" style="font-size: 1.05rem;">${item.name}</h5>
                    </div>
                  </div>
                  <div class="text-muted small mb-2"><i class="fas fa-map-marker-alt text-warning me-1"></i> ${item.city} — ${item.location}</div>
                  <div class="badge bg-light text-dark border p-2 mb-2 w-100 text-start">
                    <i class="far fa-clock me-1 text-danger"></i> ${item.schedule}
                  </div>
                  <p class="text-secondary small mb-3">${item.description}</p>
                </div>
                <div class="pt-3 border-top d-flex gap-2 justify-content-between align-items-center">
                  ${item.phone ? `<a href="tel:${item.phone}" class="btn btn-sm btn-outline-warning text-dark rounded-pill"><i class="fas fa-phone-alt me-1"></i> Contacter (${item.coordinator || 'Coord'})</a>` : ''}
                </div>
              </div>
            </div>
          `;
        }
      }).join("");
    }

    tabButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        tabButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderActiveCategory();
      });
    });

    searchInput.addEventListener("input", renderActiveCategory);
    citySelect.addEventListener("change", renderActiveCategory);

    // Détection utilisateur connecté
    onAuthStateChanged(auth, (user) => {
      const btn = document.getElementById("navProfileBtn");
      if (user && btn) {
        btn.innerHTML = `<i class="fas fa-user-circle me-1 text-success"></i> ${user.displayName ? user.displayName.split(" ")[0] : "Mon profil"}`;
      }
    });

    initData();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
